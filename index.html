<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Launcher - Web Dashboard</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-color: #181825;
            --card-color: #313244;
            --accent-color: #89b4fa;
            --text-color: #cdd6f4;
            --text-muted: #a6adc8;
            --green: #a6e3a1;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        sidebar {
            width: 240px;
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #45475a;
        }
        .logo-area {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }
        .nav-links li {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            color: var(--text-muted);
        }
        .nav-links li:hover, .nav-links li.active {
            background-color: #45475a;
            color: var(--text-color);
            border-left: 4px solid var(--accent-color);
        }
        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        header {
            padding: 20px 30px;
            border-bottom: 1px solid #45475a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #11111b;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background-color: var(--card-color);
            color: var(--text-color);
        }
        /* Instances Grid */
        .instances-container {
            padding: 0 30px 30px 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .instance-card {
            background-color: var(--card-color);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #45475a;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .instance-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }
        .instance-header {
            height: 100px;
            background: linear-gradient(45deg, #11111b, #313244);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .instance-body {
            padding: 15px;
        }
        .instance-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .instance-version {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <sidebar>
        <div class="logo-area">
            💎 Prism Web UI
        </div>
        <ul class="nav-links">
            <li class="active">Instances (1)</li>
            <li>Global Mods</li>
            <li>Resource Packs</li>
            <li>Settings</li>
            <li>About</li>
        </ul>
    </sidebar>

    <!-- Main Content -->
    <div class="main-content">
        <header>
            <h2>Quản lý phiên bản game</h2>
            <div>Tài khoản: <b>Player_Offline</b></div>
        </header>

        <div class="toolbar">
            <button class="btn" onclick="alert('Tính năng thêm Instance')">+ Thêm Instance</button>
            <button class="btn btn-secondary">Quản lý tài khoản</button>
        </div>

        <div class="instances-container">
            <!-- Minecraft Instance Item -->
            <div class="instance-card" onclick="alert('Đang khởi chạy Minecraft 1.20.4...')">
                <div class="instance-header">🧱</div>
                <div class="instance-body">
                    <div class="instance-title">Vanilla 1.20.4</div>
                    <div class="instance-version">Fabric Loader 0.15.0</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
